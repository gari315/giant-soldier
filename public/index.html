<div id="ov"><h1 id="t">巨人討伐</h1>

<div class="setRow"><div class="sl" style="flex-wrap:wrap;gap:12px"><label><input type="checkbox" id="mapC" checked> ミニマップ</label><label><input type="checkbox" id="arwC" checked> 巨人の方向表示</label><button class="b sm" id="muteB" style="font-size:14px">音 ON</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

$('go').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();startGame();},{passive:false});
setMode(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?'SP':'PC');

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);

 cc.copy(hz).lerp(mid,Math.min(1,h*3)).lerp(zn,Math.pow(h,.7));const g=Math.max(0,vv.dot(sdir));cc.r+=Math.pow(g,24)*1.2+Math.pow(g,4)*.25;cc.g+=Math.pow(g,24)*.9+Math.pow(g,4)*.12;cc.b+=Math.pow(g,24)*.5;
 if(vv.y<0)cc.copy(hz).multiplyScalar(.85);sc2[i*3]=cc.r;sc2[i*3+1]=cc.g;sc2[i*3+2]=cc.b;}
skyG.setAttribute('color',new THREE.BufferAttribute(sc2,3));
const sky=new THREE.Mesh(skyG,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-1;S.add(sky);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.03,1500);
const hemi=new THREE.HemisphereLight(0xffa56a,0x3a2630,0.85);S.add(hemi);
const sun=new THREE.DirectionalLight(0xff9a55,2.1);sun.position.set(-50,32,-90);sun.castShadow=true;
// 金属用の簡易環境マップ(夕焼けの空・暗い地面・太陽)。シーン全体には適用せず、剣・装備だけに使う
const ENV=(()=>{try{const es=new THREE.Scene(),g=new THREE.SphereGeometry(50,24,16),n=g.attributes.position.count,c=new Float32Array(n*3);
 for(let i=0;i<n;i++){const y=g.attributes.position.getY(i)/50;let r,gg,b;if(y>0){r=.95-.35*y;gg=.55+.1*y-.2*y*y;b=.32+.5*y;}else{r=.18+.25*(1+y);gg=.12+.14*(1+y);b=.1+.1*(1+y);}c[i*3]=r;c[i*3+1]=gg;c[i*3+2]=b;}
 g.setAttribute('color',new THREE.BufferAttribute(c,3));es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 const sm=new THREE.Mesh(new THREE.SphereGeometry(5,12,8),new THREE.MeshBasicMaterial({color:0xffd9a0}));sm.material.color.multiplyScalar(5);sm.position.set(-30,18,-40);es.add(sm);
 const pm=new THREE.PMREMGenerator(R),t=pm.fromScene(es,.02).texture;pm.dispose();return t;}catch(e){return null;}})();
const metalEnv=(m,k)=>{if(ENV){m.envMap=ENV;m.envMapIntensity=k||.9;m.needsUpdate=true;}return m;};
const _rs={v:7},trnd=()=>(_rs.v=(_rs.v*16807)%2147483647)/2147483647;

  updatePointerLockRetry();

  // Do not request pointer lock from a timer or from an async continuation.
  const result=R.domElement.requestPointerLock();

   result.catch(()=>{
    lockFail=true;
    updatePointerLockRetry();
